# cs-bots bundle patch —— **只 insert 自己，绝不动官方行**（默认最安全）。
#
# 安装：dsh plugin --profile web add git+ssh://git@github.com/7358716/cs-bots.git#v0.1.1
# 本 patch 由 bundle 机制自动应用，**不要**再往 profile 的 cordis.patch.yml 手动
# insert 同一 id（重复 loader entry id 会让加载失败）。
#
# ─────────────────────────────────────────────────────────────────────────────
# 【2026-11-03 重要变更】原来的「覆盖 agent-team.maxMembers」已**移出默认 patch**
#
# 原因（真实风险，非理论）：覆盖官方行的 `config` 是**整体替换**（逐 key），
# 所以我们必须重述 agent-team 的全部 4 个字段（maxMembers / maxTasks /
# maxMessageBytes / disposalTimeoutMs）。**若目标 DSH 版本的 schema 少了其中任何
# 一个字段 → config 校验失败 → 整个 profile 起不来** ——
# 这正是「重启 DSH 报错、必须禁用插件才能打开」那一类故障。
#
# 我们在 0.2.1-rc.2 上实测过该 schema，但主管环境是 rc1（可升 rc5），
# 版本面不同 → 为不拿宿主启动冒险，**默认不覆盖**。
#
# ⇒ 想要「解除官方 Team 的 8 人上限」，用显式开关：
#      bash install.sh --channel git --with-agent-team-override
#    或手动把同目录的 `cordis.patch.agent-team.yml` 内容并入 profile 的
#    cordis.patch.yml（并确认本 bundle 排在 agent-team-profile **之后**）。
#
# 注：**不覆盖也不影响本平台核心能力** —— 本平台的 Bot 注册表（RosterService）
# 走 root agent + 独立 cwd，**不受官方 maxMembers 约束**。覆盖只是让"官方 Team
# 也能超过 8 人"，属锦上添花。

- insert:
    - id: cs-bots
      name: 'cs-bots'
